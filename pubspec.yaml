name: zeus_bolt_dash
description: Olympus Aegis — a divine parry-defense arena built on a custom engine.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # First-party / low-risk plugins only. No game engine, no font fetcher,
  # no audio plugin — the simulation, rendering and haptics are hand-rolled.
  shared_preferences: ^2.3.0
  video_player: ^2.9.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  adaptive_icon_foreground: "assets/app_icon.png"
  adaptive_icon_background: "#1A2A6E"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Disable Swift Package Manager — use CocoaPods to prevent SPM
  # from modifying project.pbxproj after pod install in CI.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/
    - assets/game_assets/
    - assets/Loading/
    - assets/Notifications/
    - assets/nowifi/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
