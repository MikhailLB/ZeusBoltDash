name: zeus_bolt_dash
description: Zeus Bolt Dash — Ancient Greek arcade with a divine parry-defense arena.
publish_to: 'none'
version: 1.0.3+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── White-part ────────────────────────────────────────────
  shared_preferences: ^2.3.0
  video_player: ^2.9.1
  url_launcher: ^6.3.1

  # ── Gray gate layer ───────────────────────────────────────
  appsflyer_sdk: ^6.14.0
  app_tracking_transparency: ^2.0.2
  firebase_core: ^3.11.0
  firebase_messaging: ^15.0.4
  firebase_app_check: ^0.3.1+4
  flutter_local_notifications: ^16.3.3
  connectivity_plus: ^6.0.3
  http: ^1.2.2
  device_info_plus: ^10.0.1
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.1.3
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.1
  webview_flutter_wkwebview: ^3.19.1
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  android: true
  ios: true
  adaptive_icon_foreground: "assets/app_icon.png"
  adaptive_icon_background: "#1A2A6E"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Disable Swift Package Manager — use CocoaPods to prevent SPM
  # from modifying project.pbxproj after pod install in CI.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/
    - assets/game_assets/
    - assets/Loading/
    - assets/Notifications/
    - assets/nowifi/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
